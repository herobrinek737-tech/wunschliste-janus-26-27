name: Build and publish wish list

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify Supabase configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "::error::Repository variable VITE_SUPABASE_URL is missing" && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "::error::Repository variable VITE_SUPABASE_PUBLISHABLE_KEY is missing" && exit 1)
      - name: Install dependencies
        working-directory: ./Weinachtswebseite
        run: npm install
      - name: Build site
        working-directory: ./Weinachtswebseite
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Weinachtswebseite/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
